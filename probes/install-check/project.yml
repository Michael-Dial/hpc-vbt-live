# Throwaway probe for "Apple developer setup and installing on the XRs" (issue 14).
# Proves that the Station bundle ID signs, and that a build with an iOS 18 deployment
# target installs and launches on an XR. Not product code.
name: InstallCheck
options:
  bundleIdPrefix: edu.osu.hpc.vbt
  deploymentTarget:
    iOS: "18.0"
targets:
  InstallCheck:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.osu.hpc.vbt.station
        PRODUCT_NAME: InstallCheck
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: VBT Install Check
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        MARKETING_VERSION: 0.0.1
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
